name: Dokoshado iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: device
        options:
          - device
          - simulator

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      FIREBASE_ANALYTICS_WITHOUT_ADID: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Firebase configuration
        env:
          IOS_FIREBASE_CONFIG_BASE64: ${{ secrets.IOS_FIREBASE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_FIREBASE_CONFIG_BASE64"
          printf '%s' "$IOS_FIREBASE_CONFIG_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Build iOS app
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter --version
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub --reporter expanded
          if [[ "$BUILD_TARGET" == simulator ]]; then
            flutter build ios --simulator --debug --no-codesign --no-pub --build-name 1.0.0 --build-number 1 --dart-define=DOKOSHADO_TEST_ADS=true
            app=build/ios/iphonesimulator/Runner.app
          else
            flutter build ios --release --no-codesign --no-pub --build-name 1.0.0 --build-number 1 --dart-define=DOKOSHADO_TEST_ADS=true
            app=build/ios/iphoneos/Runner.app
          fi
          test -x "$app/Runner"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = biz.wisemap.dokoshado
          ditto -c -k --sequesterRsrc --keepParent "$app" "dokoshado-ios-$BUILD_TARGET.zip"

      - name: Save iOS build
        uses: actions/upload-artifact@v4
        with:
          name: dokoshado-ios-${{ inputs.target }}
          path: dokoshado-ios-${{ inputs.target }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
