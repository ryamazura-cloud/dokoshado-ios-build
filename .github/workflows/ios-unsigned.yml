name: Dokoshado iOS unsigned build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: device
        options:
          - device
          - simulator

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ryamazura-cloud/dokoshado-ios-build' && github.ref == 'refs/heads/main' && github.actor == 'ryamazura-cloud'
    environment: ios-build-config
    runs-on: macos-26
    timeout-minutes: 45
    env:
      FIREBASE_ANALYTICS_WITHOUT_ADID: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/flutter" tag --force 3.47.9 c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter SDK version
        run: |
          set -euo pipefail
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          python3 - <<'PY'
          import json, os, pathlib
          output = pathlib.Path(os.environ['RUNNER_TEMP'], 'flutter-version.json').read_text()
          version = None
          decoder = json.JSONDecoder()
          for index, char in enumerate(output):
              if char != '{':
                  continue
              try:
                  candidate, _ = decoder.raw_decode(output, index)
              except json.JSONDecodeError:
                  continue
              if isinstance(candidate, dict) and 'frameworkVersion' in candidate:
                  version = candidate
                  break
          assert version is not None, 'Flutter did not return version metadata'
          assert version['frameworkVersion'] == '3.47.9', 'Pinned Flutter version was not recognized'
          print('Verified Flutter ' + version['frameworkVersion'])
          PY
      - name: Install Firebase configuration
        env:
          IOS_FIREBASE_CONFIG_BASE64: ${{ secrets.IOS_FIREBASE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_FIREBASE_CONFIG_BASE64"
          printf '%s' "$IOS_FIREBASE_CONFIG_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Build iOS app
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter --version
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub --reporter expanded
          if [[ "$BUILD_TARGET" == simulator ]]; then
            flutter build ios --simulator --debug --no-codesign --no-pub --build-name 1.0.0 --build-number 1 --dart-define=DOKOSHADO_TEST_ADS=true
            app=build/ios/iphonesimulator/Runner.app
          else
            flutter build ios --release --no-codesign --no-pub --build-name 1.0.0 --build-number 1 --dart-define=DOKOSHADO_TEST_ADS=true
            app=build/ios/iphoneos/Runner.app
          fi
          test -x "$app/Runner"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = biz.wisemap.dokoshado
          ditto -c -k --sequesterRsrc --keepParent "$app" "dokoshado-ios-$BUILD_TARGET.zip"

      - name: Save iOS build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dokoshado-ios-${{ inputs.target }}
          path: dokoshado-ios-${{ inputs.target }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
